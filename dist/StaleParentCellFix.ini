[Fix]
; The source fix. The game's reference release skips references whose formID is already 0, so
; when a released one has been put back into a cell (the loader re-adds it from the worldspace's
; mobile persistent list) and that cell unloads, it is taken out of the cell's reference list but
; keeps pointing at the cell. This finishes the release for those: it clears their parentCell.
bCompleteRelease=1
; The backstop, for anything the source fix misses. Before an exterior cell is destroyed, clear
; parentCell on the worldspace's persistent references that point at it but are not in the cell's
; own reference list: the game's destructor only nulls the ones in that list, so these would keep
; pointing at the freed cell. The rest are left to the destructor; any it misses is logged. Each
; one cleared is logged. With 0 nothing is cleared, only checked and logged.
bUnlinkPersistentReferences=1

[Guards]
; Validate references/cells/worldspaces in the engine functions these crashes fault in, and answer
; "no location / no encounter zone" (or cut a stale parentCell link) instead of following freed memory.
bEnabled=1

[Diagnostics]
; Remember destroyed cells (with call stacks) and destroyed references, so reports can say what a
; dangling pointer used to be, how long ago it was destroyed and who destroyed it.
bTrackFrees=1
; Remember who marks references deleted, releases them (formID 0), gives a released one a cell or
; removes one from a cell (with call stacks), and print that under each reference a fix clears.
; Also watches each released reference put back into a cell, and logs if it leaves the cell's
; reference list without being removed from the cell.
bTrackDeletes=1
; Log the first iProbeReports access violations raised in SkyrimSE.exe code (registers, stack
; slots pointing into destroyed objects, call stack). The exception is passed on untouched.
bProbeAccessViolations=1
iProbeReports=8
; A HUD message the first time in a session that a formID 0 persistent reference is seen, a fix
; clears one, the watch loses one or a guard fires, so you know the log has something worth sending.
bNotifications=1
; Keep the call stacks of the last Change Location story events (quests started by them run later,
; on another thread) and add them to crash reports, to show what caused the event.
bTrackStoryEvents=1
; Full reports (object dumps, call stack) per guarded function; later ones are counted.
iDetailedReportsPerSite=20

[Stress]
; Reproduction aid, off for normal play. After every Change Location event (needs
; bTrackStoryEvents=1), purge the buffered unloaded cells like the `pcb` console command, so cells
; are destroyed while the quests that event starts are checking references. With guards on this
; should show up as PREVENTED entries rather than crashes.
bPurgeCellsOnLocationChange=0
